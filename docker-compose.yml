services:
  s3:
    restart: always
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_PORT_UI}:9001"
    networks:
      - ml-platform-network
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    volumes:
      - ./volumes/minio-artifacts:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  s3-buckets-init:
    image: minio/mc:latest
    container_name: s3-buckets-init
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - ml-platform-network
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://s3:9000 ${MINIO_USER} ${MINIO_PASS};
      mc mb s3/${DATALAKE_BUCKET_NAME};
      mc mb s3/${MODEL_ARTIFACTS_BUCKET_NAME};
      exit 0;
      "

networks:
  ml-platform-network:
    driver: bridge
